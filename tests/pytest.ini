[pytest]
# From this directory, an unqualified run selects the usual likelihood tests.
# Pass covariance/ explicitly to test covariance construction instead.
# The n(z) interpretation study is an explicit script under studies/, not a test.
testpaths = data_vector
# -s streams each test's explanation report to the terminal as it runs
# (pytest would otherwise capture it and print only a bare PASSED)
addopts = -v -s -p no:cacheprovider
