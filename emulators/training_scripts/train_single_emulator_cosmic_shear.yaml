data:
  train_dv:     w0wa_takahashi_dvs_train_cs_256.npy
  train_params: w0wa_takahashi_params_train_cs_256.1.txt
  train_covmat: w0wa_takahashi_params_train_cs_256.covmat
  val_dv:       w0wa_takahashi_dvs_train_cs_8.npy
  val_params:   w0wa_takahashi_params_train_cs_8.1.txt

  cosmolike_data_dir: lsst_y1
  cosmolike_dataset:  lsst_y1_M1_GGL0.05.dataset

  omegabh2_cut:  0.035
  omegabh2_lo:   0.005
  omegam2h2_lo:  0.015
  omegam2h2_hi:  0.08
  train_divisor: 10
  val_divisor:   2
  split_seed:    0
  ram_frac:      0.7

train_args:
  nepochs:      2250
  trunk_epochs: 150
  bs:           768
  loss_mode:    sqrt
  silent:       false
  clip:   1.0        # optional shared default
  rewind: true

  model:
    name: rescnn
    ia:   nla
    mlp:
      width:    96
      n_blocks: 4
    activation:
      type:    H
      n_gates: 3
    cnn:
      kernel_size: 11       # (must be odd, kz w/ nblock=1)
      rescale_kernel: true  # preserves a single block's view as the conv head deepens.
      groups: 3             # 1 = dense | 3 = per-template | 6 = both cuts
      n_blocks: 3
      separable: true
      film: true
      gate_init: 1
    trf:
      n_heads:      2       # must divide the bin length (26 → 1 | 2 | 13)
      n_blocks:     1
      n_mlp_blocks: 2
      shared_mlp:   false   # true = ONE MLP for every token
      gate_init:    1
    compile_mode: reduce-overhead

  optimizer:
    weight_decay: 0.0

  lr:
    lr_base:       0.0025
    bs_base:       64.0
    warmup_epochs: 10

  scheduler:
    mode:     min
    patience: 25
    factor:   0.8

  trim:
    start:         0.1
    end:           0.025
    hold_epochs:   50
    anneal_epochs: 300
    shape:         cosine

  focus:
    start:         0.0
    end:           2.0
    hold_epochs:   50
    anneal_epochs: 300
    shape:         linear
    kappa:         0.15

  trunk:
    lr_base:   0.0025
    loss_mode: sqrt
    trim:
      start:         0.1
      end:           0.01
      hold_epochs:   50
      anneal_epochs: 400
      shape:         cosine
    focus:
      start:         0.0
      end:           2.0
      hold_epochs:   50
      anneal_epochs: 300
      shape:         linear
      kappa:         0.15  
  head:
    lr_base:   0.001
    loss_mode: sqrt
    trim:  
      start:         0.03
      end:           0.01
      hold_epochs:   10
      anneal_epochs: 50
      shape:         cosine
    focus:
      start:         0.0
      end:           2.0
      hold_epochs:   10
      anneal_epochs: 50
      shape:         linear
      kappa:         0.2